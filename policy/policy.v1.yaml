    brane_policy_ref: agent-only
  - id: P2
    match: {category: identifier}
    action: calculate
    lane: excluded
    citation: "GDPR Arts. 4(5), 5(1)(c), 25(1), 32(1); C‑413/23 P (Nur item 3)"
